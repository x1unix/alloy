# Forge component: OTel syslog receiver.
# Receives syslog messages over TCP or UDP.
name: forge.source.syslog
stability: experimental
community: true

type: otelcol.receiver

source:
  import: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/syslogreceiver

otelcol.receiver:
  factory: |
    return syslogreceiver.NewFactory()

  config:
    type: "*syslogreceiver.SysLogConfig"

    properties:
      protocol:
        type: string
      location:
        type: string
      enable_octet_counting:
        type: bool
      allow_skip_pri_header:
        type: bool
      non_transparent_framing_trailer:
        type: string
      max_octets:
        type: int64
      on_error:
        type: string
      udp:
        type: object
        block: true
        properties:
          listen_address:
            type: string
          one_log_per_packet:
            type: bool
          add_attributes:
            type: bool
          encoding:
            type: string
      tcp:
        type: object
        block: true
        properties:
          listen_address:
            type: string
          add_attributes:
            type: bool
          encoding:
            type: string
